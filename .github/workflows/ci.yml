name: PAMOs repository and contract checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  repository-safety:
    name: repository-safety
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify tracked paths, privacy guards and documents
        run: python3 scripts/repository_guard.py
      - name: Check whitespace errors
        run: git diff --check HEAD^ HEAD

  contract-tests:
    name: contract-tests
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - name: Python environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install contract and MCP dependencies
        run: python -m pip install -r requirements/contracts.txt -r requirements/mcp_v51.txt
      - name: Compile imported Python sources
        run: python -m compileall -q src scripts pamos_mcp tests
      - name: Execute required contracts, offline regressions and stdio integration
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_v3_contracts.py
          python scripts/validate_v4_contracts.py
          python scripts/validate_v5_contracts.py
          python -m unittest discover -s tests -v
          echo "::notice::CI does not run GPU training, Phira-Pro gameplay, or RPE Next live bridge tests."
