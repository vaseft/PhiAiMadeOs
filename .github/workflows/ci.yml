name: PAMOs bootstrap checks
on:
  push:
    branches: [main, develop]
  pull_request:
permissions:
  contents: read
jobs:
  repository-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify bootstrap documents
        run: |
          test -f README.md
          test -f AGENTS.md
          test -f CODEX_START.md
          test -f LICENSE
          test -f .gitignore
      - name: Run contract checks when full Agent Kit exists
        run: |
          if [ -f scripts/validate_v3_contracts.py ]; then
            python -m pip install 'jsonschema>=4.22,<5' 'PyYAML>=6,<7'
            python scripts/validate_v3_contracts.py
          fi
          if [ -f scripts/validate_v4_contracts.py ]; then python scripts/validate_v4_contracts.py; fi
          if [ -f scripts/validate_v5_contracts.py ]; then python scripts/validate_v5_contracts.py; fi
          if [ -d tests ]; then python -m unittest discover -s tests -v; fi
